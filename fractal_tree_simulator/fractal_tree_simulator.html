<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>반복해서 만드는 나무와 무늬</title><link rel="stylesheet" href="../assets/simulator.css"><script src="../assets/simulator.js" defer></script><link rel="icon" type="image/svg+xml" href="../assets/favicon.svg"><style>#fractal-tree-app canvas{display:block;width:100%;height:auto;aspect-ratio:9/7;border:1px solid var(--websim-line);border-radius:14px;background:#fafbf7;margin:16px 0}#fractal-tree-app .fractal-tag{font-size:11px;letter-spacing:.12em;color:var(--websim-accent)}#fractal-tree-app .fractal-colors{display:grid;grid-template-columns:1fr 1fr;gap:12px}#fractal-tree-app input[type=color]{width:100%;height:38px;border:1px solid var(--websim-line);border-radius:8px;padding:3px;background:white}#fractal-tree-app .fractal-rule{background:var(--websim-paper);padding:14px;border-radius:12px}#fractal-tree-app .fractal-rule code{display:block;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.7;margin-top:8px}#fractal-tree-app .sim-stage-panel .sim-stat-grid{margin:18px 20px;grid-template-columns:repeat(3,minmax(0,1fr))}#fractal-tree-app canvas{max-width:740px;width:calc(100% - 40px);margin:20px auto}#fractal-tree-app #lines-total{display:block;font-size:11px;color:var(--sim-muted);margin-top:4px}</style></head><body><main id="fractal-tree-app" class="sim-app sim-app--fractal-tree-app">
<div class="sim-workspace"><section class="sim-stage-panel sim-panel"><div class="sim-panel-heading"><div><span class="sim-section-title">PATTERN STUDIO</span><h2 id="pattern-title">가지 나무</h2></div><span class="fractal-tag">L-SYSTEM</span></div><div class="sim-toolbar"><button class="sim-primary" id="fractal-play" aria-pressed="false">자동 재생</button><button id="grow">한 단계 생성</button><button id="reset">시작 모양</button><button id="export">SVG 저장</button><label class="sim-playback" for="playback-speed">재생 속도<select id="playback-speed"><option value="0.25">천천히 · 4초/단계</option><option value="0.5" selected>보통 · 2초/단계</option><option value="1">빠르게 · 1초/단계</option><option value="2">매우 빠르게 · 0.5초/단계</option></select></label></div><canvas id="tree-canvas" width="900" height="700" aria-label="규칙을 반복해 그린 프랙털 무늬"></canvas>
<div class="sim-stat-grid"><div class="sim-stat"><span>계산된 반복 단계</span><strong id="generation-stat">0</strong></div><div class="sim-stat"><span>표시한 선</span><strong id="lines-stat">1</strong><small id="lines-total">전체 1</small></div><div class="sim-stat"><span>갈라진 가지</span><strong id="branches-stat">0</strong></div></div><p id="growth-status" class="sim-note" role="status">한 단계 생성으로 규칙을 반복해 보세요.</p></section>
<aside class="sim-controls-panel sim-panel"><div class="sim-panel-heading"><div><span class="sim-section-title">CHANGE ONE RULE</span><h2>무늬의 재료</h2></div></div><label class="sim-control" for="pattern">무늬 선택<select id="pattern"><option value="Fractal Tree">가지 나무 · Fractal Tree</option><option value="Classic Fractal Plant">양치식물 · Fractal Plant</option><option value="Koch Snowflake">코흐 눈꽃</option><option value="Sierpinski Triangle">시어핀스키 삼각형</option><option value="Dragon Curve">드래곤 곡선</option><option value="Levy C-Curve">레비 C 곡선</option><option value="Hilbert Curve">힐베르트 곡선</option><option value="Gosper">고스퍼 곡선</option><option value="Willow">부채나무 · 네 방향 가지</option><option value="Koch Island">코흐 섬 · 네모 해안선</option><option value="Fivefold Curve">오각 회전 무늬 · 창작 규칙</option></select></label>
<label class="sim-control" for="angle">회전 각도 <output id="angle-val">25</output>°<input id="angle" type="range" min="0" max="180" value="25"></label><label class="sim-control" for="lenScale">분기 길이 비율 <output id="len-val">0.67</output><input id="lenScale" type="range" min="0.5" max="0.8" step="0.01" value="0.67"></label><label class="sim-control" for="wind">방향 흔들림 <output id="wind-val">0</output>°<input id="wind" type="range" min="0" max="5" step="0.1" value="0"></label><div class="fractal-colors"><label class="sim-control" for="color">선 색<input id="color" type="color" value="#1f6b50"></label><label class="sim-control" for="bg-color">배경 색<input id="bg-color" type="color" value="#fafbf7"></label></div>
<label class="sim-control" for="palette">색으로 읽는 구조<select id="palette"><option value="single">한 가지 선 색</option><option value="depth" selected>가지 깊이 · 숲에서 금빛으로</option><option value="order">그린 순서 · 청록에서 자주빛으로</option></select></label><p class="sim-note" id="palette-note">깊은 가지일수록 금빛입니다. 분기가 없는 곡선에서는 그린 순서에 색을 입힙니다.</p><div class="fractal-rule"><span class="sim-section-title">반복하는 규칙</span><code id="rule-preview"></code></div><p id="pattern-note" class="sim-note"></p><p class="sim-note">한 단계는 모든 문자를 동시에 바꾼 횟수입니다. 나무의 나이·바람의 물리량은 계산하지 않습니다. SVG 저장은 재생을 멈추고 현재 계산 단계의 그림을 완성해 저장합니다.</p></aside></div></main><script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('tree-canvas'),ctx=canvas.getContext('2d');
const presets={
 'Fractal Tree':{name:'가지 나무',axiom:'F',rules:{F:'FF-[-F+F+F]+[+F-F-F]'},angle:25,start:-90,branch:true,note:'[ 는 갈라지는 지점을 기억하고 ] 는 그 지점으로 돌아옵니다.'},
 'Classic Fractal Plant':{name:'양치식물',axiom:'X',rules:{X:'F-[[X]+X]+F[+FX]-X',F:'FF'},angle:25,start:-90,branch:true,note:'X는 다음 단계의 가지를 만드는 기호이며 직접 선을 그리지 않습니다.'},
 'Koch Snowflake':{name:'코흐 눈꽃',axiom:'F++F++F',rules:{F:'F-F++F-F'},angle:60,start:0,note:'한 선이 네 선으로 바뀝니다. 각도를 바꾸면 눈꽃의 닫힌 모양이 달라집니다.'},
 'Sierpinski Triangle':{name:'시어핀스키 삼각형',axiom:'F-G-G',rules:{F:'F-G+F+G-F',G:'GG'},angle:120,start:0,note:'F와 G는 모두 전진해 선을 그리지만 서로 다른 규칙으로 늘어납니다.'},
 'Dragon Curve':{name:'드래곤 곡선',axiom:'FX',rules:{X:'X+YF+',Y:'-FX-Y'},angle:90,start:0,note:'X와 Y는 선을 그리지 않는 치환 기호입니다. 90° 회전이 접힌 듯한 곡선을 만듭니다.'},
 'Levy C-Curve':{name:'레비 C 곡선',axiom:'F',rules:{F:'+F--F+'},angle:45,start:0,note:'한 선이 두 선으로 바뀌며 C 모양의 곡선이 만들어집니다.'},
 'Hilbert Curve':{name:'힐베르트 곡선',axiom:'A',rules:{A:'-BF+AFA+FB-',B:'+AF-BFB-FA+'},angle:90,start:0,note:'A와 B는 치환 기호입니다. 단계 0에는 선이 없고 첫 단계부터 공간을 채우는 경로가 보입니다.'},
 'Gosper':{name:'고스퍼 곡선',axiom:'A',rules:{A:'A-B--B+A++AA+B-',B:'+A-BB--B-A++A+B'},draw:'AB',angle:60,start:0,note:'이 규칙에서는 A와 B가 모두 전진해 선을 그립니다. 60° 회전으로 육각 격자 경로를 만듭니다.'},
 'Willow':{name:'부채나무',axiom:'F',rules:{F:'F[+F][-F][++F][--F]'},angle:24,start:-90,branch:true,note:'줄기 끝에서 네 방향으로 가지를 펴는 창작 규칙입니다. 각도를 늘리면 부채 같은 수관이 넓어지며, 실제 수종의 생장을 예측하지 않습니다.'},
 'Koch Island':{name:'코흐 섬',axiom:'F+F+F+F',rules:{F:'F+F-F-FF+F+F-F'},angle:90,start:0,note:'네모의 변마다 여덟 선을 이어 해안선 같은 굴곡을 만듭니다. 삼각 코흐 눈꽃과 다른 사각 계열 무늬입니다.'},
 'Fivefold Curve':{name:'오각 회전 무늬',axiom:'F++F++F',rules:{F:'F++F--F'},angle:36,start:0,note:'36°를 사용하는 창작 곡선입니다. Penrose의 비주기 타일링을 생성하는 규칙은 아닙니다.'}
};
let preset=presets['Fractal Tree'],sentence=preset.axiom,generation=0,segments=[];
const MAX_LINES=60000,MAX_SYMBOLS=300000;
let running=false,cycleProgress=1,completed=false,fullStage=true,lastFrame=0;
const effects=()=>Boolean(window.WebSimAmbient?.enabled&&!window.WebSimAmbient?.reducedMotion);
function pause(){running=false;syncPlayback();}
function syncPlayback(){$('fractal-play').textContent=running?'일시정지':cycleProgress<1?'이어서 재생':'자동 재생';$('fractal-play').setAttribute('aria-pressed',String(running));$('fractal-play').disabled=completed;$('grow').disabled=completed;}
function lineCount(s){const chars=preset.draw||'FG';let n=0;for(const c of s)if(chars.includes(c))n++;return n;}
function grow(animate=false){
 if(!animate)pause();
 let next='',count=0;const chars=preset.draw||'FG';
 for(const ch of sentence){const sub=preset.rules[ch]||ch;for(const c of sub)if(chars.includes(c))count++;if(count>MAX_LINES||next.length+sub.length>MAX_SYMBOLS){completed=true;running=false;cycleProgress=1;fullStage=true;paint();return false;}next+=sub;}
 sentence=next;generation++;cycleProgress=animate?0:1;fullStage=!animate||!effects();draw();return true;
}
function geometry(){let x=0,y=0,a=preset.start*Math.PI/180,len=1,depth=0;const stack=[],out=[],chars=preset.draw||'FG',angle=Number($('angle').value),ratio=Number($('lenScale').value),wind=Number($('wind').value);let i=0;for(const c of sentence){i++;if(chars.includes(c)){const nx=x+Math.cos(a)*len,ny=y+Math.sin(a)*len;out.push({x,y,nx,ny,depth});x=nx;y=ny;}else if(c==='+'||c==='-'){const wobble=(Math.sin(i*12.9898)*43758.5453%1)*wind;a+=(c==='+'?1:-1)*(angle+wobble)*Math.PI/180;}else if(c==='['){stack.push({x,y,a,len,depth});len*=ratio;depth++;}else if(c===']'){const prev=stack.pop();if(!prev)throw Error('분기 규칙 오류');({x,y,a,len,depth}=prev);}}if(stack.length)throw Error('닫히지 않은 분기');return out;}
function draw(){segments=geometry();let minX=0,maxX=0,minY=0,maxY=0;for(const s of segments){minX=Math.min(minX,s.x,s.nx);maxX=Math.max(maxX,s.x,s.nx);minY=Math.min(minY,s.y,s.ny);maxY=Math.max(maxY,s.y,s.ny);}const scale=Math.min(810/Math.max(maxX-minX,1),610/Math.max(maxY-minY,1));const tx=450-(minX+maxX)*scale/2,ty=350-(minY+maxY)*scale/2;const maxDepth=segments.reduce((m,s)=>Math.max(m,s.depth),0),mode=$('palette').value;segments=segments.map((s,i)=>{const t=mode==='depth'&&maxDepth?s.depth/maxDepth:i/Math.max(1,segments.length-1),color=mode==='single'?$('color').value:mode==='depth'?`hsl(${158-117*t},40%,${30+24*t}%)`:`hsl(${175+145*t},43%,${35+10*Math.sin(t*Math.PI)}%)`;return{...s,x:tx+s.x*scale,y:ty+s.y*scale,nx:tx+s.nx*scale,ny:ty+s.ny*scale,width:preset.branch?Math.max(.8,4*Math.pow(.72,s.depth)):1.5,color};});paint();$('color').disabled=mode!=='single';$('palette-note').textContent=mode==='single'?'고른 선 색을 모든 선에 적용합니다.':mode==='depth'?'얕은 가지는 숲빛, 깊은 가지는 금빛입니다. 분기 없는 곡선은 그린 순서입니다.':'규칙을 읽으며 그린 순서에 따라 청록에서 자주빛으로 이어집니다. 색은 물리적 성장 시간이 아닙니다.';}
function visibleProgress(){return fullStage?1:Math.min(1,cycleProgress/.8);}
function paint(){
 const reveal=visibleProgress(),count=segments.length*reveal,whole=Math.floor(count),fraction=count-whole;
 ctx.fillStyle=$('bg-color').value;ctx.fillRect(0,0,900,700);ctx.lineCap='round';
 for(let i=0;i<Math.min(segments.length,whole+(fraction>0?1:0));i++){const v=segments[i],part=i<whole?1:fraction;ctx.beginPath();ctx.strokeStyle=v.color;ctx.lineWidth=v.width;ctx.moveTo(v.x,v.y);ctx.lineTo(v.x+(v.nx-v.x)*part,v.y+(v.ny-v.y)*part);ctx.stroke();}
 $('generation-stat').textContent=generation;$('lines-stat').textContent=whole.toLocaleString();$('lines-total').textContent='전체 '+segments.length.toLocaleString();$('branches-stat').textContent=(sentence.match(/\[/g)||[]).length.toLocaleString();
 $('growth-status').textContent=completed?'표시 가능한 마지막 단계까지 재생했습니다. 다음 단계가 선 60,000개 또는 기호 300,000개 한도를 넘으므로 자동으로 멈췄습니다.':reveal<1?`${generation}단계 계산 완료 · ${running?'선을 이어 그리는 중':'그리기 일시정지'} (${Math.floor(reveal*100)}%). 단계의 규칙은 이미 적용되었고 선만 순서대로 표시합니다.`:running?`${generation}단계 그림 완료 · 다음 단계로 이어집니다.`:segments.length?`${generation}단계 그림 완료 · 자동 재생하거나 각도 하나를 바꿔 비교해 보세요.`:'아직 그릴 선이 없습니다. 자동 재생 또는 한 단계 생성을 눌러 보세요.';
 canvas.dataset.generation=String(generation);canvas.dataset.lines=String(segments.length);canvas.dataset.visibleLines=String(whole);syncPlayback();
}
function advance(ms){
 if(!running)return;let amount=Math.max(0,ms)*Number($('playback-speed').value)/1000;
 while(running&&amount>0){const remaining=1-cycleProgress;if(amount<remaining){cycleProgress+=amount;amount=0;}else{amount-=remaining;cycleProgress=1;fullStage=true;if(!grow(true))break;}}
 paint();
}
function frame(t){const dt=lastFrame?Math.min(100,Math.max(0,t-lastFrame)):0;lastFrame=t;advance(dt);requestAnimationFrame(frame);}
function togglePlayback(){if(running){pause();paint();return;}if(completed)return;running=true;if(cycleProgress>=1)grow(true);syncPlayback();}
function apply(name){pause();completed=false;cycleProgress=1;fullStage=true;preset=presets[name];sentence=preset.axiom;generation=0;$('angle').value=preset.angle;$('lenScale').value=.67;$('wind').value=0;$('lenScale').disabled=!preset.branch;$('grow').disabled=false;$('pattern-title').textContent=preset.name;$('pattern-note').textContent=preset.note;$('rule-preview').textContent='시작: '+preset.axiom+'\n'+Object.entries(preset.rules).map(([a,b])=>a+' → '+b).join('\n');update();}
function update(){pause();cycleProgress=1;fullStage=true;$('angle-val').textContent=$('angle').value;$('len-val').textContent=$('lenScale').value;$('wind-val').textContent=$('wind').value;draw();}
$('pattern').addEventListener('change',()=>apply($('pattern').value));['angle','lenScale','wind','color','bg-color'].forEach(id=>$(id).addEventListener('input',update));$('grow').onclick=()=>grow();$('fractal-play').onclick=togglePlayback;$('reset').onclick=()=>{pause();completed=false;cycleProgress=1;fullStage=true;sentence=preset.axiom;generation=0;$('grow').disabled=false;draw();};
$('palette').onchange=()=>{pause();cycleProgress=1;fullStage=true;draw();};window.addEventListener('websim:ambient-change',()=>{if(!effects())fullStage=true;paint();});canvas.style.touchAction='pan-y';window.render_game_to_text=()=>JSON.stringify({mode:'fractal',pattern:$('pattern').value,generation,running,completed,cycleProgress,visibleLines:Math.floor(segments.length*visibleProgress()),lines:segments.length,speed:Number($('playback-speed').value),palette:$('palette').value,colors:[...new Set(segments.map(s=>s.color))].slice(0,8)});window.advanceTime=advance;document.getElementById('fractal-tree-app')._model={get state(){return{generation,sentence,running,completed,cycleProgress,visibleLines:Math.floor(segments.length*visibleProgress()),segments:segments.map(s=>({...s}))};},grow,draw};
$('export').onclick=()=>{pause();cycleProgress=1;fullStage=true;paint();const svg='<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700"><rect width="900" height="700" fill="'+$('bg-color').value+'"/><g stroke-linecap="round">'+segments.map(s=>'<line x1="'+s.x+'" y1="'+s.y+'" x2="'+s.nx+'" y2="'+s.ny+'" stroke="'+s.color+'" stroke-width="'+s.width+'"/>').join('')+'</g></svg>';const u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),a=document.createElement('a');a.href=u;a.download='fractal-pattern.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};apply('Fractal Tree');grow();grow();requestAnimationFrame(frame);
})();
</script></body></html>
