    <script>
    (function(){

      }

      const shadow = host.attachShadow({ mode: "open" });

      // --- UI markup (NO JS inside the HTML string) ---
      shadow.innerHTML = `<link rel='stylesheet' href='../assets/simulator.css'>
<style>:host { display: block; color: var(--sim-ink); font-family: var(--sim-font); }
.wrap.sim-app { width: 100%; padding: 0; }

.row { display: grid; grid-template-columns: minmax(0, 1fr) 50px; gap: 7px; align-items: center; margin: 17px 0; }
.row .label { grid-column: 1 / -1; font-size: 12px; font-weight: 550; }

@media (max-width: 820px) {

}</style><main class="wrap sim-app sim-app--vicsek"><div class="sim-workspace"><section class="sim-stage-panel"><div class="sim-panel-heading"><h2>이웃을 따라 움직이는 무리</h2><span id="runStatus" class="hint">실행 중</span></div><div id="status" class="sim-stat-grid"><div class="sim-stat"><div class="k sim-stat-label">전체 방향 정렬도</div><div id="polVal" class="v sim-stat-value">0.00</div></div><div class="sim-stat"><div class="k sim-stat-label">개체 수</div><div id="agentNow" class="v sim-stat-value">320</div></div><div class="sim-stat"><div class="k sim-stat-label">계산 스텝</div><div id="stepNow" class="v sim-stat-value">0</div></div></div><div class="sim-toolbar"><button id="btnPause" class="btn primary">일시정지</button><button id="btnStep" class="btn">1스텝</button><button id="btnReset" class="btn">초기화</button><label class="model">모델<select id="modelSelect"><option value="vicsek">Vicsek · 평균 방향</option><option value="boids">Boids · 세 가지 힘</option></select></label></div><div class="stage"><canvas id="canvas" aria-label="주기적 공간에서 움직이는 개체들의 방향"></canvas></div><div id="legend" class="legend"><span><i class="swatch" style="background:#52836c"></i>개체와 진행 방향</span><span><i class="swatch" style="background:#c99854"></i>선택 이웃 거리</span><span><i class="swatch" style="background:#76ad86"></i>평균 방향</span></div><div class="chart-caption"><strong>전체 방향 정렬도의 변화</strong><span>왼쪽은 과거 → 오른쪽은 현재 · 10스텝마다 기록</span></div><canvas id="polChart" width="760" height="90" aria-label="전체 방향 정렬도의 변화"></canvas><p class="sim-note" id="observation">서로 가까운 개체의 방향만 참고해도 전체가 같은 방향을 향할 수 있습니다.</p></section><aside class="sim-controls-panel"><div class="section"><h3>공통 조건</h3><label class="row sim-control"><span class="label">개체 수</span><input id="nAgents" type="range" min="50" max="800" step="10"><span id="nAgentsVal" class="val"></span></label><label class="row sim-control"><span class="label">한 스텝 이동 거리</span><input id="speed" type="range" min="0.5" max="5" step="0.1"><span id="speedVal" class="val"></span></label><label class="row"><span class="label">초기 배치</span><select id="spawnMode"><option value="uniform">전체 무작위</option><option value="cluster">한 덩어리</option><option value="two">두 덩어리</option></select><span class="val"></span></label><label class="row sim-control"><span class="label">이웃 거리 R (모형 픽셀)</span><input id="radius" type="range" min="8" max="120" step="1"><span id="radiusVal" class="val"></span></label><span class="hint">개체 수와 초기 배치를 바꾸면 새로운 배치가 생깁니다. 공간은 고정된 800 × 520 모형 픽셀이며 화면 크기만 달라집니다.</span></div><div class="section" id="vicsekSection"><h3>Vicsek · 평균 방향과 흔들림</h3><label class="row sim-control"><span class="label">방향 흔들림 η (0–1)</span><input id="vicsekNoise" type="range" min="0" max="1" step="0.01"><span id="vicsekNoiseVal" class="val"></span></label><span class="hint">0이면 방향 오차가 없습니다. 1이면 평균 방향에 최대 ±180°의 흔들림을 줍니다. 반경 R 안의 자신과 이웃을 함께 평균냅니다.</span></div><div class="section" id="boidsSection"><h3>Boids · 분리 / 정렬 / 응집</h3><label class="row sim-control"><span class="label">분리 거리</span><input id="sepDist" type="range" min="4" max="60" step="1"><span id="sepDistVal" class="val"></span></label><label class="row sim-control"><span class="label">분리 힘</span><input id="sepForce" type="range" min="0" max="2" step="0.05"><span id="sepForceVal" class="val"></span></label><label class="row sim-control"><span class="label">정렬 거리</span><input id="aliDist" type="range" min="6" max="140" step="1"><span id="aliDistVal" class="val"></span></label><label class="row sim-control"><span class="label">정렬 힘</span><input id="aliForce" type="range" min="0" max="2" step="0.05"><span id="aliForceVal" class="val"></span></label><label class="row sim-control"><span class="label">응집 거리</span><input id="cohDist" type="range" min="6" max="200" step="1"><span id="cohDistVal" class="val"></span></label><label class="row sim-control"><span class="label">응집 힘</span><input id="cohForce" type="range" min="0" max="2" step="0.05"><span id="cohForceVal" class="val"></span></label><label class="row sim-control"><span class="label">회전 제한 (라디안/스텝)</span><input id="turnRate" type="range" min="0.02" max="0.5" step="0.01"><span id="turnRateVal" class="val"></span></label><span class="hint">분리는 가까운 개체에서 멀어지고, 정렬은 방향을 맞추고, 응집은 이웃 중심으로 향합니다. 거리는 각각 독립적으로 적용됩니다.</span></div><div class="section"><h3>관찰 표시</h3><label class="toggle"><input id="headingColors" type="checkbox">진행 방향을 색으로 보기</label><div class="button-row"><button id="nextAgent">다음 개체 관찰</button><button id="clearAgent">관찰 해제</button></div><p class="hint" id="inspectNote">개체를 탭하면 같은 개체를 계속 따라 관찰합니다.</p><div class="toggle-grid"><label class="toggle"><input id="tglStatus" type="checkbox" checked>수치 표시</label><label class="toggle"><input id="tglLegend" type="checkbox" checked>범례</label></div><label class="row"><span class="label">개체 선택</span><select id="pickMode"><option value="click">클릭 / 터치</option><option value="hover">마우스 올리기</option></select><span class="val"></span></label><span class="hint">선택한 개체 주변의 반경과 평균 방향을 표시합니다. Boids의 실제 힘은 위의 세 거리로 계산합니다.</span></div><details class="sim-explainer"><summary>정렬도와 모형의 범위</summary><p>정렬도 1은 전체가 같은 방향을 향한다는 뜻입니다. 0에 가까워도 서로 다른 방향의 작은 무리는 존재할 수 있습니다.</p><p>경계를 넘으면 반대편으로 이어집니다. 같은 스텝의 모든 개체가 이전 상태에서 방향을 계산합니다. Boids는 원 논문의 가속도 모형을 고정 속도·회전 제한으로 단순화한 변형입니다.</p><p>표시 FPS: <span id="fpsVal">0</span> · 계산은 30스텝/초로 일정합니다.</p></details></aside></div></main>`;

      // --- Simulator JS (runs after markup is in place) ---
      try{
      (function(root){
        const $ = (sel) => root.querySelector(sel);
        const canvas = $("#canvas");
        const ctx = canvas.getContext("2d", { alpha: true });


        const statusEl = $("#status");
        const legendEl = $("#legend");

        const btnPause = $("#btnPause");
        const btnStep = $("#btnStep");
        const btnReset = $("#btnReset");
        const modelSelect = $("#modelSelect");

        const nAgents = $("#nAgents");
        const nAgentsVal = $("#nAgentsVal");
        const speed = $("#speed");
        const speedVal = $("#speedVal");
        const radius = $("#radius");
        const radiusVal = $("#radiusVal");
        const spawnMode = $("#spawnMode");

        const vicsekSection = $("#vicsekSection");
        const vicsekNoise = $("#vicsekNoise");
        const vicsekNoiseVal = $("#vicsekNoiseVal");
        const pickMode = $("#pickMode");

        const boidsSection = $("#boidsSection");
        const sepDist = $("#sepDist");
        const sepDistVal = $("#sepDistVal");
        const sepForce = $("#sepForce");
        const sepForceVal = $("#sepForceVal");
        const aliDist = $("#aliDist");
        const aliDistVal = $("#aliDistVal");
        const aliForce = $("#aliForce");
        const aliForceVal = $("#aliForceVal");
        const cohDist = $("#cohDist");
        const cohDistVal = $("#cohDistVal");
        const cohForce = $("#cohForce");
        const cohForceVal = $("#cohForceVal");
        const turnRate = $("#turnRate");
        const turnRateVal = $("#turnRateVal");

        const tglStatus = $("#tglStatus");
        const tglLegend = $("#tglLegend");

        const polVal = $("#polVal");
        const fpsVal = $("#fpsVal");

        const rand = (a=0,b=1)=>a+Math.random()*(b-a);
        const TAU = Math.PI*2;

        let W=800,H=520,dpr=1;
        let modelTick=0,simAccumulator=0;const orderHistory=[];const STEP_MS=1000/30;

        const ro = new ResizeObserver(() => resizeCanvas());
        ro.observe(host);

        function resizeCanvas(){
          dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
          W = 800; H = 520;
          canvas.width = W*dpr;
          canvas.height = H*dpr;
          ctx.setTransform(dpr,0,0,dpr,0,0);
        }

        let N=320;
        let agents=[];
        let model="vicsek";

        let vSpeed=2.2;
        let neighR=35;

        let eta=0.22;

        let sepD=16, sepK=0.65;
        let aliD=52, aliK=0.55;
        let cohD=80, cohK=0.25;
        let maxTurn=0.16;

        let paused=false;
        let stepOnce=false;

        let pinnedIndex=-1;
        let pick={mode:pickMode.value,x:0,y:0,active:false};

        function wrapPos(a){
          a.x=((a.x%W)+W)%W;a.y=((a.y%H)+H)%H;
        }

        function initAgents(mode="uniform"){
          agents=[];
          const cx=W/2, cy=H/2;
          for(let i=0;i<N;i++){
            let x,y;
            if(mode==="cluster"){ x=cx+rand(-W*0.08,W*0.08); y=cy+rand(-H*0.08,H*0.08); }
            else if(mode==="two"){
              if(i<N/2){ x=W*0.35+rand(-W*0.06,W*0.06); y=H*0.5+rand(-H*0.06,H*0.06); }
              else { x=W*0.65+rand(-W*0.06,W*0.06); y=H*0.5+rand(-H*0.06,H*0.06); }
            } else { x=rand(0,W); y=rand(0,H); }

            const heading=rand(0,TAU);
            agents.push({x,y,heading,vx:Math.cos(heading)*vSpeed,vy:Math.sin(heading)*vSpeed});
          }
          orderHistory.length=0;orderHistory.push(polarization());
        }

        function dist2(a,b){
          let dx=b.x-a.x, dy=b.y-a.y;
          if(dx>W/2) dx-=W; if(dx<-W/2) dx+=W;
          if(dy>H/2) dy-=H; if(dy<-H/2) dy+=H;
          return dx*dx+dy*dy;
        }

        function neighborDelta(a,b){
          let dx=b.x-a.x, dy=b.y-a.y;
          if(dx>W/2) dx-=W; if(dx<-W/2) dx+=W;
          if(dy>H/2) dy-=H; if(dy<-H/2) dy+=H;
          return {dx,dy};
        }

        function angleWrap(t){
          while(t<=-Math.PI) t+=TAU;
          while(t>Math.PI) t-=TAU;
          return t;
        }

        function updateVicsek(){
          const r2=neighR*neighR;
          const len=agents.length;
          const newH=new Array(len);
          for(let i=0;i<len;i++){
            const a=agents[i];
            let sx=0, sy=0, c=0;
            for(let j=0;j<len;j++){
              if(i===j) continue;
              const b=agents[j];
              if(dist2(a,b)<=r2){
                sx+=Math.cos(b.heading);
                sy+=Math.sin(b.heading);
                c++;
              }
            }
            sx+=Math.cos(a.heading);
            sy+=Math.sin(a.heading);
            c++;
            const mean=Math.hypot(sx,sy)<1e-12?a.heading:Math.atan2(sy/c, sx/c);
            const noise=(rand(-0.5,0.5)*2)*eta*Math.PI;
            newH[i]=mean+noise;
          }
          for(let i=0;i<len;i++){
            const a=agents[i];
            a.x+=Math.cos(a.heading)*vSpeed;a.y+=Math.sin(a.heading)*vSpeed;
            a.heading=newH[i];
            a.vx=Math.cos(a.heading)*vSpeed;
            a.vy=Math.sin(a.heading)*vSpeed;

            wrapPos(a);
          }
        }

        function steerTowards(cur, desired){
          let d=angleWrap(desired-cur);
          d=Math.max(-maxTurn, Math.min(maxTurn, d));
          return cur+d;
        }

        function updateBoids(){
          const sep2=sepD*sepD, ali2=aliD*aliD, coh2=cohD*cohD;
          const len=agents.length;
          const newH=new Array(len);
          for(let i=0;i<len;i++){
            const a=agents[i];
            let sx=0, sy=0;
            let ax=0, ay=0, ac=0;
            let cx=0, cy=0, cc=0;
            for(let j=0;j<len;j++){
              if(i===j) continue;
              const b=agents[j];
              const d2=dist2(a,b);
              const {dx,dy}=neighborDelta(a,b);
              if(d2<=sep2 && d2>1e-6){ sx-=dx/d2; sy-=dy/d2; }
              if(d2<=ali2){ ax+=Math.cos(b.heading); ay+=Math.sin(b.heading); ac++; }
              if(d2<=coh2){ cx+=dx; cy+=dy; cc++; }
            }
            let vx=Math.cos(a.heading), vy=Math.sin(a.heading);
            let sepH=null; const sm=Math.hypot(sx,sy); if(sm>1e-6) sepH=Math.atan2(sy/sm, sx/sm);
            let aliH=null; if(ac>0) aliH=Math.atan2(ay/ac, ax/ac);
            let cohH=null; if(cc>0) cohH=Math.atan2(cy/cc, cx/cc);
            let dx=vx, dy=vy;
            if(sepH!==null){ dx+=Math.cos(sepH)*sepK; dy+=Math.sin(sepH)*sepK; }
            if(aliH!==null){ dx+=Math.cos(aliH)*aliK; dy+=Math.sin(aliH)*aliK; }
            if(cohH!==null){ dx+=Math.cos(cohH)*cohK; dy+=Math.sin(cohH)*cohK; }
            const desired=Math.atan2(dy,dx);
            newH[i]=steerTowards(a.heading, desired);
          }
          for(let i=0;i<len;i++){
            const a=agents[i];
            a.heading=newH[i];
            a.vx=Math.cos(a.heading)*vSpeed;
            a.vy=Math.sin(a.heading)*vSpeed;
            a.x+=a.vx; a.y+=a.vy;
            wrapPos(a);
          }
        }

        function polarization(){
          const len=agents.length||1;
          let sx=0, sy=0;
          for(const a of agents){ sx+=Math.cos(a.heading); sy+=Math.sin(a.heading); }
          return Math.hypot(sx,sy)/len;
        }

        function clear(){ctx.clearRect(0,0,W,H);}

        function drawAgents(){
          ctx.save();ctx.fillStyle='#52836c';ctx.strokeStyle='rgba(38,68,46,.25)';ctx.lineWidth=.5;
          for(const a of agents){ctx.save();ctx.fillStyle=$("#headingColors").checked?`hsl(${(a.heading*180/Math.PI+360)%360} 34% 42%)`:"#52836c";ctx.translate(a.x,a.y);ctx.rotate(a.heading);ctx.beginPath();ctx.moveTo(4.8,0);ctx.lineTo(-3,-2.5);ctx.lineTo(-1.6,0);ctx.lineTo(-3,2.5);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}ctx.restore();
        }

        function pickNearest(x,y){
          let best=null, bestD2=1e12;
          for(const a of agents){
            const dx=a.x-x, dy=a.y-y;
            const d2=dx*dx+dy*dy;
            if(d2<bestD2){ bestD2=d2; best=a; }
          }
          return best;
        }

        function neighborhoodAverageHeading(a){
          const r2=neighR*neighR;
          const len=agents.length;
          let sx=Math.cos(a.heading), sy=Math.sin(a.heading), c=1;
          for(let j=0;j<len;j++){
            const b=agents[j];
            if(b===a) continue;
            if(dist2(a,b)<=r2){ sx+=Math.cos(b.heading); sy+=Math.sin(b.heading); c++; }
          }
          return Math.hypot(sx,sy)<1e-12?a.heading:Math.atan2(sy/c, sx/c);
        }

        function drawHeadingVector(){
          if(!pick.active) return;
          const a=pick.mode==="click"&&pinnedIndex>=0?agents[pinnedIndex]:pickNearest(pick.x,pick.y);
          if(!a) return;

          ctx.save();
          ctx.strokeStyle="rgba(201,152,84,.8)";
          ctx.lineWidth=2;
          ctx.beginPath(); ctx.arc(a.x,a.y,neighR,0,TAU); ctx.stroke();

          const counts={vicsek:agents.filter(b=>dist2(a,b)<=neighR*neighR).length,separation:agents.filter(b=>b!==a&&dist2(a,b)<=sepD*sepD&&dist2(a,b)>1e-6).length,alignment:agents.filter(b=>b!==a&&dist2(a,b)<=aliD*aliD).length,cohesion:agents.filter(b=>b!==a&&dist2(a,b)<=cohD*cohD).length};
          $("#inspectNote").textContent=(agents.indexOf(a)+1)+'번을 관찰 중 · '+(model==='vicsek'?'자신 포함 '+counts.vicsek+'마리의 평균 방향':'분리 '+counts.separation+' / 정렬 '+counts.alignment+' / 응집 '+counts.cohesion+'마리 · 주황 원은 관찰용 R');
          const avg=neighborhoodAverageHeading(a);
          ctx.strokeStyle="rgba(83,147,101,.9)";
          ctx.lineWidth=3;
          const len=28;
          ctx.beginPath(); ctx.moveTo(a.x,a.y);
          ctx.lineTo(a.x+Math.cos(avg)*len, a.y+Math.sin(avg)*len);
          if(model==='vicsek')ctx.stroke();

          ctx.fillStyle="rgba(255,255,255,.9)";
          ctx.beginPath(); ctx.arc(a.x,a.y,3.6,0,TAU); ctx.fill();
          ctx.restore();
        }

        // UI helpers
        function setVal(el,v,d=2){ el.textContent=Number(v).toFixed(d); }
        function setInt(el,v){ el.textContent=String(Math.round(v)); }

        function syncUI(){
          nAgents.value=N; setInt(nAgentsVal,N);
          speed.value=vSpeed; setVal(speedVal,vSpeed,1);
          radius.value=neighR; setInt(radiusVal,neighR);
          vicsekNoise.value=eta; setVal(vicsekNoiseVal,eta,2);

          sepDist.value=sepD; setInt(sepDistVal,sepD);
          sepForce.value=sepK; setVal(sepForceVal,sepK,2);
          aliDist.value=aliD; setInt(aliDistVal,aliD);
          aliForce.value=aliK; setVal(aliForceVal,aliK,2);
          cohDist.value=cohD; setInt(cohDistVal,cohD);
          cohForce.value=cohK; setVal(cohForceVal,cohK,2);
          turnRate.value=maxTurn; setVal(turnRateVal,maxTurn,2);

          modelSelect.value=model;
          vicsekSection.style.display=(model==="vicsek")?"":"none";
          boidsSection.style.display=(model==="boids")?"":"none";
        }

        function reset(){
          resizeCanvas();
          modelTick=0;simAccumulator=0;orderHistory.length=0;
          initAgents(spawnMode.value);
          pick.active=false;
          ctx.clearRect(0,0,W,H);
          syncUI();
        }

        btnPause.addEventListener("click", ()=>{
          paused=!paused;
          btnPause.textContent = paused ? "이어서 실행" : "일시정지";
        });
        btnStep.addEventListener("click", ()=>{ stepOnce=true; paused=true; btnPause.textContent="이어서 실행"; });
        btnReset.addEventListener("click", ()=>{paused=true;btnPause.textContent="시작";reset();});

        modelSelect.addEventListener("change", ()=>{ model=modelSelect.value; syncUI(); });

        nAgents.addEventListener("input", ()=>{ N=parseInt(nAgents.value,10); setInt(nAgentsVal,N); });
        nAgents.addEventListener("change", ()=>reset());

        speed.addEventListener("input", ()=>{ vSpeed=parseFloat(speed.value); setVal(speedVal,vSpeed,1); });

        radius.addEventListener("input", ()=>{ neighR=parseInt(radius.value,10); setInt(radiusVal,neighR); });

        spawnMode.addEventListener("change", ()=>reset());

        vicsekNoise.addEventListener("input", ()=>{ eta=parseFloat(vicsekNoise.value); setVal(vicsekNoiseVal,eta,2); });

        sepDist.addEventListener("input", ()=>{ sepD=parseInt(sepDist.value,10); setInt(sepDistVal,sepD); });
        sepForce.addEventListener("input", ()=>{ sepK=parseFloat(sepForce.value); setVal(sepForceVal,sepK,2); });
        aliDist.addEventListener("input", ()=>{ aliD=parseInt(aliDist.value,10); setInt(aliDistVal,aliD); });
        aliForce.addEventListener("input", ()=>{ aliK=parseFloat(aliForce.value); setVal(aliForceVal,aliK,2); });
        cohDist.addEventListener("input", ()=>{ cohD=parseInt(cohDist.value,10); setInt(cohDistVal,cohD); });
        cohForce.addEventListener("input", ()=>{ cohK=parseFloat(cohForce.value); setVal(cohForceVal,cohK,2); });
        turnRate.addEventListener("input", ()=>{ maxTurn=parseFloat(turnRate.value); setVal(turnRateVal,maxTurn,2); });

        tglStatus.addEventListener("change", ()=>{ statusEl.style.display = tglStatus.checked ? "" : "none"; });
        tglLegend.addEventListener("change", ()=>{ legendEl.style.display = tglLegend.checked ? "" : "none"; });

        pickMode.addEventListener("change", ()=>{ pick.mode=pickMode.value; pick.active=false; });

        function pointerPos(ev){
          const rect = canvas.getBoundingClientRect();
          const x = (ev.clientX - rect.left) * (W / rect.width);
          const y = (ev.clientY - rect.top) * (H / rect.height);
          return {x,y};
        }

        canvas.addEventListener("mousemove", (ev)=>{
          if(pick.mode!=="hover") return;
          const p=pointerPos(ev);
          pick.x=p.x; pick.y=p.y; pick.active=true;
        });
        canvas.addEventListener("mouseleave", ()=>{
          if(pick.mode!=="hover") return;
          pick.active=false;
        });
        canvas.addEventListener("click", (ev)=>{
          if(pick.mode!=="click") return;
          const p=pointerPos(ev);
          pick.x=p.x; pick.y=p.y; pick.active=true;pinnedIndex=agents.indexOf(pickNearest(p.x,p.y));
        });
        canvas.style.touchAction="pan-y";
        $("#nextAgent").onclick=()=>{pick.mode="click";pickMode.value="click";pinnedIndex=(pinnedIndex+1)%agents.length;pick.active=true;render();};
        $("#clearAgent").onclick=()=>{pick.active=false;pinnedIndex=-1;$("#inspectNote").textContent="개체를 탭하면 같은 개체를 계속 따라 관찰합니다.";render();};

        // main loop
        let lastTime=performance.now();
        let fps=0, fpsAcc=0, fpsN=0, fpsLast=performance.now();

        function step(){
          modelTick++;
          if(model==="vicsek") updateVicsek();
          else updateBoids();
          if(modelTick%10===0){orderHistory.push(polarization());if(orderHistory.length>180)orderHistory.shift();}
        }

        function render(){
          clear();
          drawAgents();
          drawHeadingVector();
          polVal.textContent = polarization().toFixed(2);
          fpsVal.textContent = String(Math.round(fps));
          $("#agentNow").textContent=agents.length;$("#stepNow").textContent=modelTick;$("#runStatus").textContent=paused?'멈춤':'실행 중';
          $("#observation").textContent=polarization()>.75?'전체 방향이 상당히 맞춰졌습니다. 흔들림을 올려 이 정렬이 유지되는지 살펴보세요.':'전체 방향은 아직 다양합니다. 이웃 거리와 방향 흔들림을 하나씩 바꿔 국소 규칙의 영향을 비교하세요.';
          const chart=$("#polChart"),g=chart.getContext('2d'),cw=chart.width,ch=chart.height;g.clearRect(0,0,cw,ch);g.strokeStyle='#e0e7dc';g.beginPath();g.moveTo(24,14);g.lineTo(cw-8,14);g.moveTo(24,ch-14);g.lineTo(cw-8,ch-14);g.stroke();g.fillStyle='#69766c';g.font='11px system-ui';g.fillText('1',6,18);g.fillText('0',6,ch-10);g.strokeStyle='#1f6b50';g.lineWidth=2;g.beginPath();orderHistory.forEach((v,i)=>{const x=24+i/Math.max(1,orderHistory.length-1)*(cw-32),y=14+(1-v)*(ch-28);if(i)g.lineTo(x,y);else g.moveTo(x,y);});g.stroke();
        }

        function tick(t){
          const dt=t-lastTime;
          lastTime=t;

          fpsAcc += dt; fpsN++;
          if(t - fpsLast >= 400){
            fps = 1000 * fpsN / fpsAcc;
            fpsAcc=0; fpsN=0; fpsLast=t;
          }

          try{
            if(stepOnce){step();stepOnce=false;simAccumulator=0;}else if(!paused){simAccumulator+=Math.min(dt,150);while(simAccumulator>=STEP_MS){step();simAccumulator-=STEP_MS;}}else simAccumulator=0;
            render();
          }catch(e){
            paused=true;
            if(btnPause) btnPause.textContent = "이어서 실행";
            // show error on overlay so it doesn't look like "nothing"
            try{
              statusEl.style.display = "";
              polVal.textContent = "ERR";
              fpsVal.textContent = "";
            }catch(_){ }
            console.error(e);
          }
          requestAnimationFrame(tick);
        }

        window.render_game_to_text=()=>JSON.stringify({mode:'vicsek-boids',selectedIndex:pick.active?pinnedIndex:null,headingColors:$("#headingColors").checked,model,paused,tick:modelTick,count:agents.length,order:polarization(),noise_half_width_radians:eta*Math.PI,world:{width:W,height:H},bounded:agents.every(a=>a.x>=0&&a.x<W&&a.y>=0&&a.y<H),agents:agents.map(a=>({x:a.x,y:a.y,heading:a.heading,speed:Math.hypot(a.vx,a.vy)}))});
        window.advanceTime=ms=>{for(let i=0;i<Math.floor(ms/STEP_MS+1e-9);i++)step();render();};
        // boot
        resizeCanvas();
        initAgents("uniform");
        syncUI();
        statusEl.style.display = tglStatus.checked ? "" : "none";
        legendEl.style.display = tglLegend.checked ? "" : "none";

        requestAnimationFrame((t0)=>{
          lastTime=t0;
          requestAnimationFrame(tick);
        });
      })(shadow);
      }catch(e){
        console.error(e);
        shadow.innerHTML = `<div style="padding:14px;font-family:ui-sans-serif,system-ui;color:#111">시뮬레이터 초기화에 실패했습니다 ㅠㅠ F12 를 눌러 콘솔을 확인해 주세요 (__*</div>`;
      }
    })();
    </script>
  </div>
</body>
</html>
